<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的运动主页 · Workouts</title>
  <meta name="description" content="个人运动记录主页 · 跑步 / 骑行 / 训练 / 习惯打卡" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏃</text></svg>" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <!-- ===================== 顶部导航 ===================== -->
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="#top">
        <span class="brand-logo">🏃</span>
        <span class="brand-name">我的运动主页</span>
      </a>
      <nav class="nav">
        <a href="#heatmap">热力图</a>
        <a href="#stats">统计</a>
        <a href="#activities">活动</a>
        <a href="#tracks">轨迹</a>
        <a href="#habits">习惯</a>
      </nav>
      <button id="themeToggle" class="theme-toggle" aria-label="切换主题">🌙</button>
    </div>
  </header>

  <main id="top">
    <!-- ===================== Hero ===================== -->
    <section class="hero container">
      <div class="hero-card">
        <div class="hero-avatar" id="heroAvatar">🏃</div>
        <div class="hero-meta">
          <h1 id="heroName">阿涛</h1>
          <p class="hero-tagline" id="heroTagline"></p>
          <p class="hero-sub">
            <span id="heroLocation"></span> ·
            自 <span id="heroSince"></span> 起记录
          </p>
        </div>
        <div class="hero-stats" id="heroStats"><!-- JS 填充 --></div>
      </div>
    </section>

    <!-- ===================== 年度热力图 ===================== -->
    <section id="heatmap" class="section container">
      <div class="section-head">
        <h2>年度热力图</h2>
        <div class="year-tabs" id="yearTabs"><!-- JS 填充 --></div>
      </div>
      <div class="heatmap-wrap">
        <div class="heatmap-months" id="heatmapMonths"></div>
        <div class="heatmap-grid" id="heatmapGrid"></div>
        <div class="heatmap-legend">
          <span>少</span>
          <span class="lg lg-0"></span>
          <span class="lg lg-1"></span>
          <span class="lg lg-2"></span>
          <span class="lg lg-3"></span>
          <span class="lg lg-4"></span>
          <span>多</span>
        </div>
      </div>
    </section>

    <!-- ===================== 数据统计 ===================== -->
    <section id="stats" class="section container">
      <div class="section-head"><h2>数据统计</h2></div>
      <div class="stat-cards" id="statCards"><!-- JS 填充 --></div>
    </section>

    <!-- ===================== 最近活动 ===================== -->
    <section id="activities" class="section container">
      <div class="section-head">
        <h2>最近活动</h2>
        <div class="filters" id="activityFilters">
          <button class="chip active" data-type="all">全部</button>
          <button class="chip" data-type="run">🏃 跑步</button>
          <button class="chip" data-type="ride">🚴 骑行</button>
          <button class="chip" data-type="hike">🥾 徒步</button>
          <button class="chip" data-type="moto">🏍️ 摩托</button>
          <button class="chip" data-type="workout">🏋️ 训练</button>
        </div>
      </div>
      <ul class="activity-list" id="activityList"><!-- JS 填充 --></ul>
    </section>

    <!-- ===================== 轨迹墙 ===================== -->
    <section id="tracks" class="section container">
      <div class="section-head"><h2>轨迹墙</h2></div>
      <div class="tracks-grid" id="tracksGrid"><!-- JS 填充 --></div>
    </section>

    <!-- ===================== 习惯打卡 ===================== -->
    <section id="habits" class="section container">
      <div class="section-head"><h2>习惯打卡</h2></div>
      <div class="habit-cards" id="habitCards"><!-- JS 填充 --></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>用 ♥ 记录每一步 · 数据本地生成，可替换为真实记录</p>
      <p class="muted">灵感来自 <a href="https://github.com/zhaohongxuan/workouts" target="_blank" rel="noopener">zhaohongxuan/workouts</a></p>
    </div>
  </footer>

  <script src="assets/js/real_data.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
